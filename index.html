<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayvan Dostları - Öğren & Eğlen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFC23C">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@500;600;700&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8EC; --cream-2:#FFEFD6;
  --grass:#5FB86B; --grass-dark:#3E8E4C;
  --sky:#5EC1DE; --sky-dark:#2E97BB;
  --sun:#FFC23C; --coral:#FF8B72; --coral-dark:#E96A50;
  --ink:#4A3626; --ink-soft:#8A6F58; --white:#FFFFFF;
  --purple:#9B6FD1; --purple-dark:#7A4FB0;
  --radius-lg:32px; --radius-md:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;width:100%;max-width:100vw;overflow-x:hidden;}
body{min-height:100vh;font-family:'Quicksand',sans-serif;color:var(--ink);
  background:radial-gradient(circle at 15% 8%,#FFE9BE 0%,transparent 45%),
             radial-gradient(circle at 90% 85%,#CFEFD9 0%,transparent 40%),var(--cream);
  overflow-x:hidden;display:flex;justify-content:center;
  background-size:200% 200%;animation:gradientShift 14s ease infinite;
  -webkit-transform:translateZ(0);transform:translateZ(0);}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
html[dir="rtl"] body{font-family:'Noto Sans Arabic','Quicksand',sans-serif;}
.stage{width:100%;max-width:560px;min-height:100vh;position:relative;display:flex;flex-direction:column;margin:0 auto;}
@media (min-width:700px){
  .stage{max-width:min(88vw,760px);}
  .section-grid{grid-template-columns:repeat(3,1fr);}
  .match-grid{grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto;}
}
@media (min-width:1000px){
  .stage{max-width:min(85vw,1000px);}
  .section-grid{grid-template-columns:repeat(4,1fr);}
}
@media (min-width:700px) and (orientation:landscape){
  .screen{padding-top:32px;}
  .stage{max-width:min(90vw,1200px);}
}
h1,h2,h3{font-family:'Baloo 2',sans-serif;margin:0;}
html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3{font-family:'Noto Sans Arabic',sans-serif;}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;position:relative;z-index:1;min-height:100vh;animation:fadeIn .4s ease;}
.screen.top{justify-content:flex-start;padding-top:20px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.big-btn{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;color:var(--white);
  background:linear-gradient(180deg,var(--sun) 0%,#F2A928 100%);border:none;border-radius:999px;
  padding:16px 32px;box-shadow:0 7px 0 #C8850F,0 12px 22px rgba(200,133,15,.25);cursor:pointer;
  min-height:60px;min-width:180px;transition:transform .08s,box-shadow .08s;}
.big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #C8850F,0 4px 10px rgba(200,133,15,.25);}
.big-btn.green{background:linear-gradient(180deg,var(--grass) 0%,var(--grass-dark) 100%);box-shadow:0 7px 0 #2E6E3A,0 12px 22px rgba(46,110,58,.25);}
.big-btn.green:active{box-shadow:0 2px 0 #2E6E3A;}
.big-btn.blue{background:linear-gradient(180deg,var(--sky) 0%,var(--sky-dark) 100%);box-shadow:0 7px 0 #1E7690,0 12px 22px rgba(30,118,144,.25);}
.big-btn.blue:active{box-shadow:0 2px 0 #1E7690;}
.big-btn.purple{background:linear-gradient(180deg,var(--purple) 0%,var(--purple-dark) 100%);box-shadow:0 7px 0 #5E3A8A,0 12px 22px rgba(94,58,138,.25);}
.big-btn.purple:active{box-shadow:0 2px 0 #5E3A8A;}
.big-btn.small{font-size:16px;padding:12px 22px;min-height:48px;min-width:120px;}
.big-btn:disabled{opacity:.45;cursor:not-allowed;}
.ghost-btn{background:none;border:2px solid #E7D5B8;color:var(--ink-soft);font-family:'Baloo 2',sans-serif;
  font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer;font-size:15px;min-height:44px;}
.topnav{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;margin:0 auto 16px;}
.topnav .title{font-size:18px;color:var(--ink);}
.card{background:var(--white);border-radius:var(--radius-lg);padding:26px 22px;width:100%;max-width:480px;
  margin:0 auto;box-shadow:0 14px 0 rgba(94,193,222,.15),0 18px 34px rgba(60,120,140,.1);border:3px solid #EFEAD8;
  text-align:center;}
.input-big{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;text-align:center;
  border:3px solid #EFD9AF;border-radius:16px;padding:14px 16px;width:100%;max-width:280px;color:var(--ink);
  background:var(--cream-2);margin:10px auto;display:block;}
.badge{display:inline-block;background:var(--cream-2);border-radius:999px;padding:6px 14px;font-size:13px;
  font-weight:700;color:var(--ink-soft);font-family:'Baloo 2',sans-serif;}
.premium-badge{background:linear-gradient(90deg,#FFE9AE,#FFD37A);color:#8A5A00;}

.lang-row{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.lang-flag{font-size:22px;background:var(--cream-2);border-radius:12px;padding:6px 9px;cursor:pointer;border:2px solid transparent;}
.lang-flag.sel{border-color:var(--grass);background:#DFF4E1;}
.lang-row.compact{margin-bottom:10px;}
.lang-row.compact .lang-flag{font-size:16px;padding:4px 6px;}

.love-card{background:linear-gradient(165deg,var(--white) 0%,#FFF3E0 100%);border-radius:var(--radius-lg);
  padding:36px 28px 30px;text-align:center;box-shadow:0 18px 0 rgba(233,178,120,.25),0 22px 40px rgba(120,80,30,.12);
  max-width:440px;width:100%;border:3px solid #FFE3B0;}
.love-card .critters{font-size:44px;margin-bottom:6px;letter-spacing:6px;}
.love-card h1{font-size:28px;color:var(--coral-dark);margin-bottom:12px;line-height:1.25;}
.love-card p{font-size:16px;line-height:1.6;color:var(--ink-soft);margin:0 0 24px;}

.hub-header{width:100%;max-width:480px;margin:0 auto 10px;display:flex;justify-content:space-between;align-items:center;}
.hub-title{font-size:24px;color:var(--coral-dark);}
.mode-grid{display:flex;flex-direction:column;gap:14px;width:100%;max-width:480px;margin:0 auto;}
.mode-tile{display:flex;align-items:center;gap:16px;background:var(--white);border-radius:var(--radius-md);
  padding:18px 18px;border:3px solid #F0E6D0;box-shadow:0 6px 0 #EDE0C5;cursor:pointer;text-align:left;}
html[dir="rtl"] .mode-tile{text-align:right;}
.mode-tile:active{transform:translateY(3px);box-shadow:0 2px 0 #EDE0C5;}
.mode-tile .ic{font-size:38px;flex-shrink:0;animation:bob 3s ease-in-out infinite;}
.mode-tile:nth-child(2) .ic{animation-delay:.3s;}
.mode-tile:nth-child(3) .ic{animation-delay:.6s;}
.mode-tile:nth-child(4) .ic{animation-delay:.9s;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mode-tile .tx h3{font-size:18px;color:var(--ink);}
.mode-tile .tx p{margin:2px 0 0;font-size:13px;color:var(--ink-soft);}
.premium-banner{width:100%;max-width:480px;margin:0 auto 16px;background:linear-gradient(120deg,#FFE9AE,#FFD37A);
  border-radius:20px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:2px solid #F0C158;}
.premium-banner span{font-family:'Baloo 2',sans-serif;font-weight:700;color:#7A4E00;font-size:14px;}

.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:480px;margin:0 auto;}
.section-tile{border-radius:20px;padding:18px 10px;text-align:center;cursor:pointer;border:3px solid rgba(0,0,0,0.05);
  box-shadow:0 6px 0 rgba(0,0,0,0.08);color:var(--white);animation:tilePop .4s ease backwards;}
.section-tile:nth-child(1){animation-delay:.02s}.section-tile:nth-child(2){animation-delay:.06s}
.section-tile:nth-child(3){animation-delay:.10s}.section-tile:nth-child(4){animation-delay:.14s}
.section-tile:nth-child(5){animation-delay:.18s}.section-tile:nth-child(6){animation-delay:.22s}
.section-tile:nth-child(7){animation-delay:.26s}.section-tile:nth-child(8){animation-delay:.30s}
.section-tile:nth-child(9){animation-delay:.34s}.section-tile:nth-child(10){animation-delay:.38s}
@keyframes tilePop{from{opacity:0;transform:scale(.7) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.section-tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.08);}
.section-tile .ic{font-size:34px;display:block;margin-bottom:8px;line-height:0;}
.section-tile .ic svg{filter:drop-shadow(0 3px 2px rgba(0,0,0,.18));}
.section-tile{position:relative;overflow:hidden;}
.section-tile::before{content:"";position:absolute;left:8px;right:8px;top:6px;height:22px;border-radius:12px;background:rgba(255,255,255,.22);pointer-events:none;}
.section-tile .nm{display:inline-block;background:#fff;color:#4A3426;padding:3px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.08);}
.section-tile:nth-child(11){animation-delay:.42s}
.hub-scene-wrap{width:100%;max-width:480px;margin:0 auto 14px;}
.hub-scene{width:100%;height:auto;display:block;border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.06);}
.mode-tile .ic svg{display:block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15));}
.section-tile .nm{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:14px;}

.topbar{width:100%;max-width:480px;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 18px;}
.question-card{width:100%;max-width:480px;margin:0 auto;background:var(--white);border-radius:var(--radius-lg);
  padding:28px 22px 24px;text-align:center;box-shadow:0 14px 0 rgba(94,193,222,.18),0 18px 34px rgba(60,120,140,.12);
  border:3px solid #DFF3F8;}
.animal-emoji{font-size:72px;line-height:1;margin-bottom:8px;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}70%{transform:scale(1.08) rotate(3deg)}100%{transform:scale(1) rotate(0)}}
.question-text{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;margin:4px 0 6px;line-height:1.3;}
html[dir="rtl"] .question-text{font-family:'Noto Sans Arabic',sans-serif;}
.speak-btn{display:inline-flex;align-items:center;gap:6px;background:var(--cream-2);border:none;border-radius:999px;
  padding:9px 16px;font-family:'Quicksand',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);
  margin:8px 0 18px;cursor:pointer;min-height:40px;}
.answers{display:flex;flex-direction:column;gap:12px;}
.answer-btn{font-family:'Baloo 2',sans-serif;font-size:18px;font-weight:600;color:var(--ink);background:var(--cream);
  border:3px solid #F1E2C8;border-radius:var(--radius-md);padding:16px 18px;min-height:62px;display:flex;
  align-items:center;gap:12px;cursor:pointer;text-align:left;box-shadow:0 5px 0 #EAD9B8;
  transition:transform .08s,box-shadow .08s,background .2s,border-color .2s;}
html[dir="rtl"] .answer-btn{text-align:right;font-family:'Noto Sans Arabic',sans-serif;}
.answer-btn .oe{font-size:26px;flex-shrink:0;}
.answer-btn:active:not(.locked){transform:translateY(4px);box-shadow:0 1px 0 #EAD9B8;}
.answer-btn.correct{background:#DFF4E1;border-color:var(--grass);box-shadow:0 5px 0 var(--grass-dark);}
.answer-btn.wrong{background:#FFE6E1;border-color:var(--coral);box-shadow:0 5px 0 var(--coral-dark);}
.answer-btn.dim{opacity:.5;}
.feedback{width:100%;max-width:480px;margin:14px auto 0;text-align:center;font-family:'Baloo 2',sans-serif;
  font-size:19px;font-weight:700;min-height:28px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;}
.feedback.show{opacity:1;transform:translateY(0);}
.feedback.good{color:var(--grass-dark);} .feedback.soft{color:var(--coral-dark);}

.ad-card{background:linear-gradient(165deg,#FFFDF5 0%,#FFF3D6 100%);border-radius:var(--radius-lg);
  padding:28px 22px;text-align:center;max-width:440px;width:100%;border:3px dashed #F0C158;
  box-shadow:0 14px 0 rgba(240,193,88,.2),0 18px 34px rgba(160,120,20,.1);}
.ad-chip{display:inline-block;background:#7A4E00;color:#fff;font-family:'Baloo 2',sans-serif;font-weight:700;
  font-size:12px;padding:5px 14px;border-radius:999px;margin-bottom:14px;letter-spacing:.5px;}
.ad-card .fact-emoji{font-size:56px;margin-bottom:10px;}
.ad-card .fact-text{font-size:17px;line-height:1.55;color:var(--ink);margin-bottom:18px;}
.ad-progress{width:100%;height:8px;background:#F0E0BC;border-radius:999px;overflow:hidden;margin-bottom:18px;}
.ad-progress-bar{height:100%;background:var(--grass);width:0%;transition:width 1s linear;}

.avatar-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
.avatar-opt{font-size:32px;background:var(--cream-2);border-radius:16px;padding:10px;cursor:pointer;border:3px solid transparent;text-align:center;}
.avatar-opt.sel{border-color:var(--grass);background:#DFF4E1;transform:scale(1.05);}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:14px 0;}
.pin-dot{width:16px;height:16px;border-radius:50%;background:#EAD9B8;}
.pin-dot.filled{background:var(--grass);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
.keypad button{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;padding:16px 0;border-radius:16px;
  border:none;background:var(--cream-2);color:var(--ink);cursor:pointer;}
.keypad button:active{transform:scale(.95);background:#F0E0BC;}
.big-avatar{font-size:60px;margin-bottom:6px;}
.wiggle{display:inline-block;animation:wiggle 2.6s ease-in-out infinite;}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bob{animation:bob 2.2s ease-in-out infinite;}
.sparkle-ring{position:relative;}
.sparkle-ring::before,.sparkle-ring::after{content:'✨';position:absolute;font-size:22px;animation:sparkle 1.8s ease-in-out infinite;}
.sparkle-ring::before{top:-6px;left:-10px;}
.sparkle-ring::after{bottom:-6px;right:-10px;animation-delay:.9s;}
@keyframes sparkle{0%,100%{opacity:.2;transform:scale(.8) rotate(0deg)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}

.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:480px;margin:0 auto;}
.badge-tile{background:var(--white);border-radius:18px;padding:16px 10px;text-align:center;border:3px solid #F0E6D0;box-shadow:0 5px 0 #EDE0C5;}
.badge-tile.locked{opacity:.4;filter:grayscale(1);}
.badge-tile .bic{font-size:34px;display:block;margin-bottom:6px;}
.badge-tile .bnm{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;}

.match-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:480px;margin:0 auto;}
.match-card{aspect-ratio:1/1;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:30px;cursor:pointer;background:linear-gradient(160deg,var(--sky) 0%,var(--sky-dark) 100%);
  box-shadow:0 5px 0 #1E7690;user-select:none;transition:transform .15s;}
.match-card.flipped{background:var(--white);border:3px solid var(--grass);box-shadow:0 5px 0 #EAD9B8;}
.match-card.matched{background:#DFF4E1;border:3px solid var(--grass);box-shadow:none;opacity:.75;}
.match-card:active{transform:scale(.94);}
.match-stats{display:flex;gap:14px;justify-content:center;margin-bottom:14px;}
.match-stats .stat{font-family:'Baloo 2',sans-serif;font-weight:700;color:var(--ink-soft);font-size:14px;}
.match-toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--grass-dark);color:#fff;
  font-family:'Baloo 2',sans-serif;font-weight:700;padding:10px 20px;border-radius:999px;z-index:60;
  box-shadow:0 6px 14px rgba(0,0,0,.2);animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}

.timer-ring{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:800;color:var(--coral-dark);
  background:var(--white);border:3px solid var(--coral);border-radius:999px;padding:8px 18px;display:inline-block;
  margin-bottom:14px;}
.timer-ring.low{color:#fff;background:var(--coral-dark);animation:pulse .6s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.vs-row{display:flex;justify-content:space-between;width:100%;max-width:480px;margin:0 auto 14px;gap:10px;}
.vs-player{flex:1;background:var(--white);border-radius:16px;padding:10px 12px;text-align:center;border:2px solid #EFEAD8;}
.vs-player .nm{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);}
.vs-player .sc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;color:var(--grass-dark);}
.handoff-card{background:linear-gradient(165deg,var(--white) 0%,#E9F3FF 100%);border-radius:var(--radius-lg);
  padding:34px 24px;text-align:center;max-width:420px;width:100%;border:3px solid #CFE6FA;}
.handoff-card .ic{font-size:54px;margin-bottom:10px;}
.room-code{font-family:'Baloo 2',sans-serif;font-size:36px;font-weight:800;letter-spacing:8px;color:var(--purple-dark);
  background:var(--cream-2);border-radius:16px;padding:14px 10px;margin:14px 0;}

.end-card{background:linear-gradient(165deg,var(--white) 0%,#EAF8EC 100%);border-radius:var(--radius-lg);
  padding:34px 24px 28px;text-align:center;max-width:440px;width:100%;box-shadow:0 18px 0 rgba(95,184,107,.2),
  0 22px 40px rgba(60,120,60,.12);border:3px solid #DDF0DE;}
.end-card .big-emoji{font-size:60px;margin-bottom:8px;}
.end-card h2{font-size:24px;color:var(--grass-dark);margin-bottom:8px;}
.score-line{font-size:18px;color:var(--ink-soft);margin-bottom:16px;}
.score-line b{color:var(--coral-dark);font-size:22px;}
.end-card .love-msg{font-size:15px;line-height:1.6;color:var(--ink-soft);background:var(--cream-2);border-radius:18px;
  padding:14px 16px;margin-bottom:22px;}
.btn-stack{display:flex;flex-direction:column;gap:10px;align-items:center;}

.confetti-piece{position:fixed;top:-40px;font-size:24px;z-index:80;pointer-events:none;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2;}}
.footer-trail{position:fixed;bottom:0;left:0;right:0;height:34px;
  background-image:radial-gradient(circle,rgba(95,184,107,.16) 10px,transparent 11px);
  background-size:46px 34px;background-position:0 10px;pointer-events:none;z-index:0;}
#bgFx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;-webkit-transform:translateZ(0);transform:translateZ(0);}
.bg-float{position:absolute;bottom:-60px;font-size:28px;opacity:.22;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}10%{opacity:.25;}90%{opacity:.2;}100%{transform:translateY(-115vh) translateX(30px) rotate(25deg);opacity:0;}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;}}
</style>
</head>
<body>
<div class="footer-trail"></div>
<div class="stage" id="stage"></div>

<script>
/* ============================================================
   LANGUAGE / i18n CORE
============================================================ */
const LANGS = ['tr','en','de','nl','ar'];
const LANG_META = {
  tr:{flag:'🇹🇷',name:'Türkçe',dir:'ltr',speech:'tr-TR'},
  en:{flag:'🇬🇧',name:'English',dir:'ltr',speech:'en-US'},
  de:{flag:'🇩🇪',name:'Deutsch',dir:'ltr',speech:'de-DE'},
  nl:{flag:'🇳🇱',name:'Nederlands',dir:'ltr',speech:'nl-NL'},
  ar:{flag:'🇸🇦',name:'العربية',dir:'rtl',speech:'ar-SA'}
};
let currentLang = 'tr';
try{ const saved = localStorage.getItem('hd_lang'); if(saved && LANGS.includes(saved)) currentLang = saved; }catch(e){}

function setLang(l){
  currentLang = l;
  try{ localStorage.setItem('hd_lang', l); }catch(e){}
  document.documentElement.lang = l;
  document.documentElement.dir = LANG_META[l].dir;
}
function t(key, vars){
  let s = (STRINGS[key] && STRINGS[key][currentLang]) || (STRINGS[key] && STRINGS[key].en) || key;
  if(vars){ Object.keys(vars).forEach(k=>{ s = s.split('{'+k+'}').join(vars[k]); }); }
  return s;
}
function langRow(compact){
  return `<div class="lang-row ${compact?'compact':''}">${LANGS.map(l=>{
    const locked = !FREE_LANGS.includes(l) && !store.premium;
    return `<span class="lang-flag ${l===currentLang?'sel':''}" data-lang="${l}">${LANG_META[l].flag}${locked?'🔒':''}</span>`;
  }).join('')}</div>`;
}
function wireLangRow(onChange){
  document.querySelectorAll('.lang-flag').forEach(el=>{
    el.addEventListener('click', ()=>{
      const l = el.dataset.lang;
      const locked = !FREE_LANGS.includes(l) && !store.premium;
      if(locked){ renderPremium(onChange); return; }
      setLang(l); onChange();
    });
  });
}

function enQ(k){ return EN_Q[k][currentLang] || EN_Q[k].en; }
function threeFrom(list, i, keyFn){
  const key = keyFn(list[i]);
  return shuffle(list.map((_,k)=>k).filter(k=>k!==i && keyFn(list[k])!==key)).slice(0,2);
}
function buildEnglishPairs(){
  const out = [];
  EN_ALPHABET.forEach((_,i)=> out.push(['letter',i]));
  EN_WORDS.forEach((_,i)=> out.push(['word',i]));
  EN_NUMBERS.forEach((_,i)=>{ out.push(['numWord',i]); out.push(['wordNum',i]); });
  EN_COLORS.forEach((_,i)=> out.push(['color',i]));
  return out;
}
function buildEnglishQuestion(pair){
  const [type, i] = pair;
  if(type==='letter'){
    const [L, w, e] = EN_ALPHABET[i];
    const o = threeFrom(EN_ALPHABET, i, x=>x[0]);
    const opts = shuffle([{t:L,e:'🔤',c:true}].concat(o.map(k=>({t:EN_ALPHABET[k][0],e:'🔤',c:false}))));
    return {emoji:e, q:enQ('letter').split('{w}').join(w), answers:opts, sayEn:w};
  }
  if(type==='word' || type==='color'){
    const list = type==='word' ? EN_WORDS : EN_COLORS;
    const [e, w] = list[i];
    const o = threeFrom(list, i, x=>x[1]);
    const opts = shuffle([{t:w,e:e,c:true}].concat(o.map(k=>({t:list[k][1],e:list[k][0],c:false}))));
    return {emoji:e, q:enQ(type), answers:opts, enAnswers:true};
  }
  if(type==='numWord'){
    const o = threeFrom(EN_NUMBERS, i, x=>x);
    const opts = shuffle([{t:EN_NUMBERS[i],e:'🔢',c:true}].concat(o.map(k=>({t:EN_NUMBERS[k],e:'🔢',c:false}))));
    return {emoji:String(i+1), q:enQ('numWord').split('{n}').join(String(i+1)), answers:opts, enAnswers:true, big:true};
  }
  // wordNum
  const o = threeFrom(EN_NUMBERS, i, x=>x);
  const opts = shuffle([{t:String(i+1),e:'🔢',c:true}].concat(o.map(k=>({t:String(k+1),e:'🔢',c:false}))));
  return {emoji:'🔢', q:enQ('wordNum').split('{w}').join(EN_NUMBERS[i]), answers:opts, sayEn:EN_NUMBERS[i]};
}
/* Speak an English word with an English voice (queued after the question). */
function speakEnglish(text){
  if(!store.soundOn) return;
  try{
    if(!('speechSynthesis' in window) || !text) return;
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.85; u.pitch=1.2;
    const vv = window.speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith('en'));
    if(vv) u.voice=vv;
    u.onstart=()=>MUSIC.duck(true); u.onend=()=>MUSIC.duck(false); u.onerror=()=>MUSIC.duck(false);
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildAnimalPairs(){
  const out = [];
  ANIMAL_FACTS.forEach((a,i)=>{
    out.push([i,'name']);
    if(a[2]) out.push([i,'sound']);
    if(a[3]) out.push([i,'habitat']);
    if(a[4]) out.push([i,'food']);
    if(a[5]!==null) out.push([i,'legs']);
  });
  return out;
}
function otherAnimals(i, n, filter){
  return shuffle(ANIMAL_FACTS.map((_,k)=>k).filter(k=>k!==i && (!filter || filter(ANIMAL_FACTS[k])))).slice(0,n);
}
function buildAnimalFactQuestion(pair){
  const [i, type] = pair;
  const a = ANIMAL_FACTS[i];
  const [emoji, names, sound, hab, food, legs] = a;
  const L = currentLang;
  if(type==='name'){
    const o = otherAnimals(i,2);
    const opts = shuffle([{t:nameOf(names),e:emoji,c:true}].concat(o.map(k=>({t:nameOf(ANIMAL_FACTS[k][1]),e:ANIMAL_FACTS[k][0],c:false}))));
    return {emoji, q:ANIMAL_TQ.name[L]||ANIMAL_TQ.name.en, answers:opts};
  }
  if(type==='sound'){
    const s = nameOf(sound);
    const o = otherAnimals(i,2,x=>!x[2] || nameOf(x[2])!==s);
    const opts = shuffle([{t:nameOf(names),e:emoji,c:true}].concat(o.map(k=>({t:nameOf(ANIMAL_FACTS[k][1]),e:ANIMAL_FACTS[k][0],c:false}))));
    return {emoji:'🔊', q:(ANIMAL_TQ.sound[L]||ANIMAL_TQ.sound.en).split('{s}').join(s), answers:opts};
  }
  if(type==='habitat' || type==='food'){
    const dict = type==='habitat' ? HABITATS : FOODS;
    const key = type==='habitat' ? hab : food;
    const excl = (type==='habitat' ? HAB_EXCL[emoji] : FOOD_EXCL[emoji]) || [];
    const others = shuffle(Object.keys(dict).filter(k=>k!==key && !excl.includes(k) && (type==='habitat' || FOOD_CAT[k]!==FOOD_CAT[key]))).slice(0,2);
    const opts = shuffle([key].concat(others).map(k=>({t:nameOf(dict[k][1]),e:dict[k][0],c:k===key})));
    return {emoji, q:ANIMAL_TQ[type][L]||ANIMAL_TQ[type].en, answers:opts};
  }
  // legs
  const pool = shuffle([0,2,4,6,8].filter(v=>v!==legs)).slice(0,2);
  const opts = shuffle([legs].concat(pool).map(v=>({t:String(v),e:'🦶',c:v===legs})));
  return {emoji, q:ANIMAL_TQ.legs[L]||ANIMAL_TQ.legs.en, answers:opts};
}

const PREMIUM_SKU = 'premium_unlock';
const BILLING_METHOD = 'https://play.google.com/billing';
async function getBillingService(){
  try{
    if(!window.getDigitalGoodsService) return null;

function purchasePremium(onResult){
  (async()=>{
    try{
      const service = await getBillingService();
      if(!service || !window.PaymentRequest){ onResult(null); return; }   // not in Play build
      const details = await service.getDetails([PREMIUM_SKU]);
      if(!details || !details.length){ onResult(false); return; }
      const request = new PaymentRequest(
        [{ supportedMethods: BILLING_METHOD, data: { sku: PREMIUM_SKU } }],
        { total: { label: 'Premium', amount: { currency: 'USD', value: '0' } } }
      );
      const response = await request.show();
      const token = response.details && response.details.token;
      if(token){ await service.acknowledge(token, 'onetime'); }
      await response.complete('success');
      store.premium = true;
      onResult(true);
    }catch(e){ onResult(false); }
  })();
}

  try{

    const purchases = await service.listPurchases();
    if(purchases && purchases.some(p=>p.itemId===PREMIUM_SKU) && !store.premium){ store.premium = true; }
  }catch(e){}
}

               76,0,79,84, 83,81,79,0,  77,0,81,84, 83,81,77,0,  79,81,79,77, 76,74,76,79, 74,0,79,0, 72,0,0,0];
  const BASS = [48,55,52,55, 53,57,50,55, 48,55,52,55, 53,55,48,48];   // one per half bar
  let gain = null, timer = null, step = 0, nextT = 0, on = false;
  const store = {
    get(){ try{ const v = localStorage.getItem('hd_music'); return v === null ? true : v === '1'; }catch(e){ return true; } },
    set(v){ try{ localStorage.setItem('hd_music', v ? '1' : '0'); }catch(e){} }
  };
  function tone(freq, t, dur, type, vol){
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(gain); o.start(t); o.stop(t + dur + 0.05);
  }
  function schedule(){
    while(nextT < audioCtx.currentTime + 0.25){
      const m = MEL[step % MEL.length];
      if(m){ tone(N(m), nextT, STEP * 1.6, 'triangle', 0.22); tone(N(m + 12), nextT, STEP * 0.6, 'sine', 0.05); }
      if(step % 4 === 0){ tone(N(BASS[(step / 4) % BASS.length]), nextT, STEP * 3.4, 'sine', 0.20); }
      if(step % 2 === 1){ tone(N(96), nextT, 0.04, 'square', 0.012); }   // soft tick
      nextT += STEP; step++;
    }
  }
  function start(){
    if(!store.get() || on) return;
    try{
      ensureAudio();
      gain = audioCtx.createGain(); gain.gain.value = 0.0001; gain.connect(audioCtx.destination);
      gain.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 1.2);
      step = 0; nextT = audioCtx.currentTime + 0.1; on = true;
      timer = setInterval(schedule, 60); schedule();
    }catch(e){}
  }
  function stop(){
    on = false; if(timer){ clearInterval(timer); timer = null; }
    if(gain){ const g = gain; try{ g.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.2); setTimeout(()=>{ try{ g.disconnect(); }catch(e){} }, 900); }catch(e){} gain = null; }
  }
  function duck(down){ if(!gain) return; try{ gain.gain.setTargetAtTime(down ? 0.07 : 0.35, audioCtx.currentTime, 0.15); }catch(e){} }
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stop(); });
  return {
    start, stop, duck,
    get enabled(){ return store.get(); },
    toggle(){ const v = !store.get(); store.set(v); if(v) start(); else stop(); return v; },
    resume(){ if(store.get() && !on) start(); }
  };
})();

function playApplause(){
  if(!store.soundOn) return;

  [523.25,659.25,783.99,1046.5].forEach((freq,i)=>{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type='triangle'; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0.0001, now+i*0.09);
    gain.gain.linearRampToValueAtTime(0.18, now+i*0.09+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+i*0.09+0.28);
    osc.connect(gain); gain.connect(ctx.destination); osc.start(now+i*0.09); osc.stop(now+i*0.09+0.3);
  });
  const clapStart=now+0.32;
  for(let i=0;i<14;i++){
    const t2=clapStart+i*0.055+Math.random()*0.02;
    const bufferSize=ctx.sampleRate*0.05;
    const buffer=ctx.createBuffer(1,bufferSize,ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let j=0;j<bufferSize;j++){ data[j]=(Math.random()*2-1)*(1-j/bufferSize); }
    const noise=ctx.createBufferSource(); noise.buffer=buffer;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1800+Math.random()*1500; bp.Q.value=0.8;
    const g=ctx.createGain(); g.gain.setValueAtTime(0.35+Math.random()*0.15,t2); g.gain.exponentialRampToValueAtTime(0.001,t2+0.09);
    noise.connect(bp); bp.connect(g); g.connect(ctx.destination); noise.start(t2); noise.stop(t2+0.1);
  }
}

const EMOJI_RE = /[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{2022}]/gu;
function speak(text){
  if(!store.soundOn) return;
  try{
    if(!('speechSynthesis' in window)) return;
    const clean = text.replace(EMOJI_RE,'').replace(/\s+/g,' ').trim();
    if(!clean) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean); u.lang=LANG_META[currentLang].speech; u.rate=0.95; u.pitch=1.25;
    const voices=window.speechSynthesis.getVoices();
    const short = LANG_META[currentLang].speech.split('-')[0];
    const langVoices = voices.filter(v=>v.lang && v.lang.toLowerCase().startsWith(short));
    const femaleHints = ['female','kadın','woman','yelda','filiz','zira','seyfi','samantha','victoria','susan','karen','zira','emel'];
    const vv = langVoices.find(v => femaleHints.some(h => v.name.toLowerCase().includes(h)))
      || langVoices.find(v => !/male|erkek|man\b/i.test(v.name))
      || langVoices[0];
    if(vv) u.voice=vv;
    u.onstart=()=>MUSIC.duck(true); u.onend=()=>MUSIC.duck(false); u.onerror=()=>MUSIC.duck(false);
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function genCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=chars[randInt(0,chars.length-1)]; return s; }

/* ============================================================
   QUESTION BUILDERS (language-aware)
============================================================ */
function nameOf(dict){ return dict[currentLang] || dict.en; }
function buildFromCrafted(entry){
  const [emoji, ansEmojis, byLang] = entry;
  const L = byLang[currentLang] || byLang.en;
  const opts = L.a.map((txt,i)=>({t:txt, e:ansEmojis[i], c:i===0}));
  return {emoji, q:L.q, answers:shuffle(opts)};
}
function genCounting(){
  const [emoji,names] = pick(COUNT_ITEMS);
  const name = nameOf(names);
  const n = randInt(2,6);
  const row = new Array(n).fill(emoji).join(' ');
  let wrongA = n-1<1 ? n+1 : n-1, wrongB=n+1; if(wrongB===wrongA) wrongB=n+2;
  const opts = shuffle([n,wrongA,wrongB]).map(v=>({t:String(v), e:'🔢', c:v===n}));
  return {emoji:row, q:COUNT_Q[currentLang].split('{name}').join(name), answers:opts, big:true};
}
function genAddition(){
  const [emoji,names] = APPLE_ITEM[0];
  const name = nameOf(names);
  const a=randInt(1,4), b=randInt(1,4);
  const row = new Array(a).fill(emoji).join(' ') + '  +  ' + new Array(b).fill(emoji).join(' ');
  const sum=a+b;
  let wrongA=sum-1<1?sum+1:sum-1, wrongB=sum+1; if(wrongB===wrongA) wrongB=sum+2;
  const opts = shuffle([sum,wrongA,wrongB]).map(v=>({t:String(v), e:emoji, c:v===sum}));
  return {emoji:row, q:ADD_Q[currentLang].split('{name}').join(name), answers:opts, big:true};
}
/* Turkish question particle by vowel harmony: mı / mi / mu / mü */
function trQ(w){ const v=(w.toLocaleLowerCase('tr').match(/[aıoueiöü]/g)||['e']).pop(); return ({a:'mı',ı:'mı',o:'mu',u:'mu',e:'mi',i:'mi',ö:'mü',ü:'mü'})[v]; }
function genSizeCompare(){
  let i=randInt(0,SIZE_RANK.length-1), j=randInt(0,SIZE_RANK.length-1);
  while(j===i) j=randInt(0,SIZE_RANK.length-1);
  const A=SIZE_RANK[i], B=SIZE_RANK[j];
  const nameA = nameOf(A[2]), nameB = nameOf(B[2]);
  const bigger = A[1]>B[1] ? A : B;
  const opts = shuffle([
    {t:nameA, e:A[0], c:A===bigger},
    {t:nameB, e:B[0], c:B===bigger},
    {t:SIZE_EQUAL[currentLang], e:'⚖️', c:false}
  ]);
  let qtext = SIZE_Q[currentLang].split('{A}').join(nameA).split('{B}').join(nameB);
  if(currentLang==='tr') qtext = `${nameA} ${trQ(nameA)}, ${nameB} ${trQ(nameB)} daha büyüktür?`;
  return {emoji:`${A[0]} ${B[0]}`, q:qtext, answers:opts};
}
function buildTemplatedQuestion(sectionId, idx){
  const items = MATCH_DATA[sectionId];
  const correct = items[idx];
  let distractIdx = shuffle(items.map((_,i)=>i).filter(i=>i!==idx)).slice(0,2);
  const opts = shuffle([
    {t:nameOf(correct[1]), e:correct[0], c:true},
    {t:nameOf(items[distractIdx[0]][1]), e:items[distractIdx[0]][0], c:false},
    {t:nameOf(items[distractIdx[1]][1]), e:items[distractIdx[1]][0], c:false}
  ]);
  return {emoji:correct[0], q:TEMPLATE_Q[sectionId][currentLang], answers:opts};
}
function makeQueue(sectionId){
  let data = sectionId==='animals' ? ANIMALS_Q_DATA : sectionId==='planets' ? PLANETS_Q_DATA : sectionId==='numbers' ? NUMBERS_Q_DATA : null;
  const itemIdxRange = MATCH_DATA[sectionId] ? MATCH_DATA[sectionId].map((_,i)=>i) : null;
  return {
    sectionId,
    pool: data ? shuffle(data) : null, ptr:0,
    apool: sectionId==='animals' ? shuffle(buildAnimalPairs()) : sectionId==='english' ? shuffle(buildEnglishPairs()) : null, aptr:0,
    itemPool: itemIdxRange ? shuffle(itemIdxRange) : null, itemPtr:0
  };
}
function nextFromQueue(state, data){
  if(state.ptr >= state.pool.length){ state.pool = shuffle(data); state.ptr = 0; }
  return state.pool[state.ptr++];
}
function nextItemIdx(state){
  if(state.itemPtr >= state.itemPool.length){ state.itemPool = shuffle(MATCH_DATA[state.sectionId].map((_,i)=>i)); state.itemPtr = 0; }
  return state.itemPool[state.itemPtr++];
}
function nextQuestion(state){
  const r = Math.random();
  if(state.sectionId==='animals'){
    if(r<0.08) return genSizeCompare();
    if(r<0.15) return genCounting();
    if(r<0.30) return buildFromCrafted(nextFromQueue(state, ANIMALS_Q_DATA));
    if(state.aptr >= state.apool.length){ state.apool = shuffle(buildAnimalPairs()); state.aptr = 0; }
    return buildAnimalFactQuestion(state.apool[state.aptr++]);
  }
  if(state.sectionId==='planets'){ return buildFromCrafted(nextFromQueue(state, PLANETS_Q_DATA)); }
  if(state.sectionId==='english'){
    if(state.aptr >= state.apool.length){ state.apool = shuffle(buildEnglishPairs()); state.aptr = 0; }
    return buildEnglishQuestion(state.apool[state.aptr++]);
  }
  if(state.sectionId==='numbers'){
    if(r<0.45) return genAddition();
    if(r<0.8) return genCounting();
    return buildFromCrafted(nextFromQueue(state, NUMBERS_Q_DATA));
  }
  return buildTemplatedQuestion(state.sectionId, nextItemIdx(state));
}
function buildGeneralQuestionSet(n){
  const out = [];
  const secIds = SECTIONS_DATA.map(s=>s.id);
  for(let i=0;i<n;i++){
    const id = secIds[i % secIds.length];
    const tempState = makeQueue(id);
    out.push(nextQuestion(tempState));
  }
  return shuffle(out);
}

function startQuizSession(sectionId){
  quiz = { sectionId, queue: makeQueue(sectionId), answered:0, correct:0, current:null, locked:false };
  renderQuizQuestion();
}
function renderQuizQuestion(){
  quiz.locked = false;
  quiz.current = nextQuestion(quiz.queue);
  const sec = secById(quiz.sectionId);
  const item = quiz.current;
  const answersHtml = item.answers.map((a,idx)=>`
    <button class="answer-btn" data-idx="${idx}"><span class="oe">${a.e}</span><span>${a.t}</span></button>`).join('');
  stage.innerHTML = `
    <div class="screen top">
      ${topNav()}
      <div class="topbar"><span class="badge">${sec.icon} ${nameOf(sec.name)}</span><span class="badge">✅ ${quiz.correct} / ${quiz.answered}</span></div>
      <div class="question-card">
        <div class="animal-emoji" style="${item.big?'font-size:44px;letter-spacing:6px;':''}">${item.emoji}</div>
        <div class="question-text">${item.q}</div>
        <button class="speak-btn" id="speakBtn">${t('speakAgain')}</button>
        <div class="answers">${answersHtml}</div>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>`;
  wireBack(()=>{ quiz=null; renderSectionGrid(); });
  document.getElementById('speakBtn').addEventListener('click', ()=>{ speak(item.q); if(item.sayEn) speakEnglish(item.sayEn); });
  stage.querySelectorAll('.answer-btn').forEach(btn=> btn.addEventListener('click', onQuizAnswer));
  speak(item.q); if(item.sayEn) speakEnglish(item.sayEn);
}
function onQuizAnswer(e){
  if(quiz.locked) return; quiz.locked = true;
  const idx = parseInt(e.currentTarget.dataset.idx,10);
  const item = quiz.current;
  const chosen = item.answers[idx];
  const feedback = document.getElementById('feedback');
  stage.querySelectorAll('.answer-btn').forEach((b,i)=>{
    if(item.answers[i].c) b.classList.add('correct');
    if(i===idx && !chosen.c) b.classList.add('wrong');
    if(i!==idx) b.classList.add('dim');
  });
  quiz.answered++;
  if(chosen.c){
    quiz.correct++;
    if(profile){ ensureProfileShape(profile); profile.stats.correct++; profile.stats.sections[quiz.sectionId]=true; checkBadges(); }
    playApplause(); burstConfetti();
    const msg = nameOf(pick(PRAISE)); feedback.textContent = msg; feedback.className='feedback show good'; speak(msg);
    if(item.enAnswers) speakEnglish(chosen.t);
  }else{
    playGentle();
    const correctAns = item.answers.find(a=>a.c);
    const msg = nameOf(pick(GENTLE))+' '+correctAns.t;
    feedback.textContent = msg; feedback.className='feedback show soft';
    speak(msg);
    if(item.enAnswers) speakEnglish(correctAns.t);
  }
  setTimeout(()=>{
    if(quiz.answered>0 && quiz.answered%10===0){ afterGame(()=> renderAdBreak(()=> renderQuizQuestion(), 'quiz')); }
    else{ renderQuizQuestion(); }
    showBadgeToastQueue();
  }, 2000);
}

   see PLAY_STORE_REHBERI.md "Reklamlar" section for setup steps)

/* ---- WEB-ONLY ADS (Google AdSense "H5 Games Ads") ----
   ⚠️ KAPALI. AdSense onayı gelince ADSENSE_CLIENT'a yayıncı kimliğini yazın (ör. 'ca-pub-1234567890123456').
   Reklam ASLA Android uygulamasında (IS_TWA) gösterilmez: Play'deki "reklam içermiyor" beyanı geçerli kalır. */
const ADSENSE_CLIENT = '';
const WEB_ADS = !!ADSENSE_CLIENT && !IS_TWA;
let adBreak = null;
if(WEB_ADS){
  try{
    window.adsbygoogle = window.adsbygoogle || [];
    window.adsbygoogle.requestNonPersonalizedAds = 1;   // child-directed: no personalised ads
    const sc = document.createElement('script');
    sc.async = true;
    sc.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + ADSENSE_CLIENT;
    sc.crossOrigin = 'anonymous';
    sc.setAttribute('data-ad-frequency-hint', '120s');   // at most one ad every 2 minutes
    document.head.appendChild(sc);
    adBreak = o => window.adsbygoogle.push(o);
    window.adsbygoogle.push({ preloadAdBreaks: 'on', sound: 'on' });
  }catch(e){ adBreak = null; }
}
function maybeShowInterstitial(onDone){
  if(WEB_ADS && adBreak){
    let done = false; const finish = ()=>{ if(done) return; done = true; MUSIC.duck(false); onDone(); };
    try{
      adBreak({ type:'next', name:'mola',
        beforeAd: ()=> MUSIC.duck(true),
        afterAd:  ()=> MUSIC.duck(false),
        adBreakDone: finish });
      setTimeout(finish, 45000);   // safety: never block the game
      return;
    }catch(e){}
  }
  onDone(); // Android app & no ads configured: just continue
}

function rs(k){ return (RATE_STR[k][currentLang]) || RATE_STR[k].en; }
const rateStore = {
  get(k,d){ try{ const v=localStorage.getItem('hd_rate_'+k); return v===null?d:parseInt(v,10); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('hd_rate_'+k, String(v)); }catch(e){} }
};
/* Call when a game round ends; shows the prompt when it is time, otherwise just continues. */
function afterGame(next){
  const games = rateStore.get('games',0)+1; rateStore.set('games',games);
  const rated = rateStore.get('done',0), asks = rateStore.get('asks',0), nextAt = rateStore.get('nextAt',2);
  if(!rated && asks<3 && games>=nextAt){
    rateStore.set('asks',asks+1); rateStore.set('nextAt',games+4);
    renderRatingAsk(next);
  } else { next(); }
}

function renderMatchSectionPicker(){
  stage.innerHTML = `
    <div class="screen top">
      ${topNav()}
      <h2 style="margin-bottom:14px;">${t('matchPickTitle')}</h2>
      <div class="section-grid" id="secGrid"></div>
    </div>`;
  wireBack(renderHub);
  const grid = document.getElementById('secGrid');
  grid.innerHTML = SECTIONS_DATA.map(s=>{
    const locked = !FREE_SECTIONS.includes(s.id) && !store.premium;
    return `<div class="section-tile" data-id="${s.id}" data-locked="${locked?1:0}" style="background:${tileBg(s)};position:relative;">
      ${locked?'<span style="position:absolute;top:6px;right:8px;font-size:16px;">🔒</span>':''}
      <span class="ic">${sectionArt(s.id,74)||s.icon}</span><span class="nm">${nameOf(s.name)}</span>
    </div>`;
  }).join('');
  grid.querySelectorAll('.section-tile').forEach(el=> el.addEventListener('click', ()=>{
    if(el.dataset.locked==='1'){ renderPremium(renderMatchSectionPicker); return; }
    startMatchGame(el.dataset.id);
  }));
}
function startMatchGame(sectionId){
  const pairCount = store.premium ? 8 : 6;
  const items = shuffle(getMatchItems(sectionId, currentLang)).slice(0,pairCount);
  let cards = [];
  items.forEach((it,i)=>{ cards.push({pairId:i, emoji:it[0], name:it[1]}); cards.push({pairId:i, emoji:it[0], name:it[1]}); });
  cards = shuffle(cards).map((c,i)=>({...c, id:i, flipped:false, matched:false}));
  match = { sectionId, cards, flippedIds:[], moves:0, matchedCount:0, total:pairCount, locked:false };
  renderMatchBoard();
}
function renderMatchBoard(){
  const sec = secById(match.sectionId);
  stage.innerHTML = `
    <div class="screen top">
      ${topNav()}
      <h2 style="margin-bottom:8px;">${sec.icon} ${nameOf(sec.name)}</h2>
      <div class="match-stats">
        <div class="stat">${t('matchMoves')} <span id="movesTx">${match.moves}</span></div>
        <div class="stat">${t('matchMatched')} <span id="matchedTx">${match.matchedCount}/${match.total}</span></div>
      </div>
      <div class="match-grid" id="matchGrid"></div>
    </div>`;
  wireBack(()=>{ match=null; renderMatchSectionPicker(); });
  const grid = document.getElementById('matchGrid');
  grid.innerHTML = match.cards.map(c=>`
    <div class="match-card ${c.matched?'matched':(c.flipped?'flipped':'')}" data-id="${c.id}">
      ${(c.flipped||c.matched) ? c.emoji : '❓'}
    </div>`).join('');
  grid.querySelectorAll('.match-card').forEach(el=> el.addEventListener('click', onMatchCardClick));
}
function onMatchCardClick(e){
  if(match.locked) return;
  const id = parseInt(e.currentTarget.dataset.id,10);
  const card = match.cards.find(c=>c.id===id);
  if(!card || card.flipped || card.matched) return;
  card.flipped = true; match.flippedIds.push(id);
  renderMatchBoard();
  if(match.flippedIds.length===2){
    match.locked = true; match.moves++;
    const [a,b] = match.flippedIds.map(fid=> match.cards.find(c=>c.id===fid));
    if(a.pairId===b.pairId){
      setTimeout(()=>{
        a.matched=true; b.matched=true; match.matchedCount++;
        match.flippedIds=[]; match.locked=false;
        playDing(); burstConfetti(8);
        showToast(t('matchToast',{emoji:a.emoji, name:a.name}));
        if(match.matchedCount===match.total){ setTimeout(renderMatchEnd, 700); } else { renderMatchBoard(); }
      }, 500);
    }else{
      setTimeout(()=>{ a.flipped=false; b.flipped=false; match.flippedIds=[]; match.locked=false; renderMatchBoard(); }, 900);
    }
  }
}
function showToast(text){
  const el=document.createElement('div'); el.className='match-toast'; el.textContent=text;
  document.body.appendChild(el); setTimeout(()=>el.remove(),1400);
}
function renderMatchEnd(){
  if(profile){ ensureProfileShape(profile); profile.stats.matches = (profile.stats.matches||0)+1; checkBadges(); }
  maybeShowInterstitial(()=> renderMatchEndScreen());
}
function renderMatchEndScreen(){
  playApplause(); burstConfetti(24);
  stage.innerHTML = `
    <div class="screen">
      <div class="end-card">
        <div class="big-emoji">🏆</div>
        <h2>${t('matchEndTitle')}</h2>
        <div class="score-line">${t('matchEndMoves')} <b>${match.moves}</b></div>
        <div class="love-msg">${t('matchEndMsg')}</div>
        <div class="btn-stack">
          <button class="big-btn green" id="again">${t('playAgain')}</button>
          <button class="ghost-btn" id="toHub">${t('toMainMenu')}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('again').onclick = ()=> afterGame(()=> startMatchGame(match.sectionId));
  document.getElementById('toHub').onclick = ()=> afterGame(renderHub);
}

function renderCompHandoff(){
  const p = comp[comp.turn];
  stage.innerHTML = `

  document.getElementById('ready').onclick = ()=>{ comp.timeLeft = RUN_TIME; comp.running = true; runCompQuestion(); };
  wireBack(()=>{ clearInterval(comp.timerHandle); comp=null; renderCompHome(); });

function runCompQuestion(){
  const p = comp[comp.turn];
  if(p.index >= comp.questions.length || comp.timeLeft<=0){ return endCompTurn(); }
  const item = comp.questions[p.index];
  stage.innerHTML = `
    <div class="screen">
      <div style="text-align:center;width:100%;"><div class="timer-ring" id="timerRing">⏱ ${comp.timeLeft}s</div></div>
      <div class="question-card">
        <div class="badge" style="margin-bottom:10px;">${p.name} — ${p.index+1}/${comp.questions.length}</div>
        <div class="animal-emoji">${item.emoji}</div>
        <div class="question-text">${item.q}</div>
        <div class="answers">${item.answers.map((a,idx)=>`<button class="answer-btn" data-idx="${idx}"><span class="oe">${a.e}</span><span>${a.t}</span></button>`).join('')}</div>
      </div>
      ${(!STORE_SAFE_MODE && !store.premium)?`<button class="ghost-btn" id="watchAd" style="margin-top:14px;">${t('watchAdBtn')}</button>`:''}
    </div>`;
  stage.querySelectorAll('.answer-btn').forEach(btn=> btn.addEventListener('click', (e)=>{
    clearInterval(comp.timerHandle);
    const idx = parseInt(e.currentTarget.dataset.idx,10);
    if(item.answers[idx].c){ p.score++; playApplause(); burstConfetti(10); } else { playGentle(); }
    p.index++;
    setTimeout(runCompQuestion, 500);
  }));
  const adBtn = document.getElementById('watchAd');
  if(adBtn) adBtn.onclick = ()=>{ clearInterval(comp.timerHandle); renderAdBreak(()=>{ comp.timeLeft += 15; runCompQuestion(); }, 'comp'); };
  clearInterval(comp.timerHandle);
  comp.timerHandle = setInterval(()=>{
    comp.timeLeft--;
    const ring = document.getElementById('timerRing');
    if(ring){ ring.textContent = '⏱ '+comp.timeLeft+'s'; if(comp.timeLeft<=10) ring.classList.add('low'); }
    if(comp.timeLeft<=0){ clearInterval(comp.timerHandle); endCompTurn(); }
  }, 1000);
}
function endCompTurn(){
  clearInterval(comp.timerHandle);
  if(comp.turn==='p1'){ comp.turn='p2'; renderCompHandoff(); } else { renderCompLocalResults(); }

function renderCompLocalResults(){

async function onlineCreateRoom(name){
  try{
    const code = genCode();
    const questions = buildGeneralQuestionSet(RUN_QCOUNT);
    const ref = dbCap.doc('rooms/'+code);
    await ref.set({ code, createdAt: Date.now(), questions,
      p1:{name, score:0, index:0, done:false, timeLeft:RUN_TIME}, p2:null });
    comp = { mode:'online', code, slot:'p1', ref, questions, name };
    renderCompOnlineWaiting();
  }catch(e){ alert(t('roomFailAlert')); renderCompOnlineHome(); }
}
async function onlineJoinRoom(code, name){
  try{
    const ref = dbCap.doc('rooms/'+code);
    const snap = await ref.get();
    if(!snap.exists){ alert(t('noRoomAlert')); return; }
    const data = snap.data();
    if(data.p2 && data.p2.name){ alert(t('roomFullAlert')); return; }
    await ref.update({ p2:{name, score:0, index:0, done:false, timeLeft:RUN_TIME} });
    comp = { mode:'online', code, slot:'p2', ref, questions:data.questions, name };
    renderCompOnlineReady();
  }catch(e){ alert(t('joinFailAlert')); renderCompOnlineHome(); }
}

      ${(!STORE_SAFE_MODE && !store.premium)?`<button class="ghost-btn" id="watchAd" style="margin-top:14px;">${t('watchAdBtn')}</button>`:''}
    </div>`;
  stage.querySelectorAll('.answer-btn').forEach(btn=> btn.addEventListener('click',(e)=>{
    clearInterval(comp.timerHandle);
    const idx=parseInt(e.currentTarget.dataset.idx,10);
    if(item.answers[idx].c){ comp.score++; playApplause(); burstConfetti(10); } else { playGentle(); }
    comp.index++;
    setTimeout(onlineRunQuestion, 500);
  }));
  const adBtn = document.getElementById('watchAd');
  if(adBtn) adBtn.onclick = ()=>{ clearInterval(comp.timerHandle); renderAdBreak(()=>{ comp.timeLeft+=15; onlineRunQuestion(); },'comp'); };
  clearInterval(comp.timerHandle);
  comp.timerHandle = setInterval(()=>{
    comp.timeLeft--;
    const ring=document.getElementById('timerRing');
    if(ring){ ring.textContent='⏱ '+comp.timeLeft+'s'; if(comp.timeLeft<=10) ring.classList.add('low'); }
    if(comp.timeLeft<=0){ clearInterval(comp.timerHandle); finishOnlineTurn(); }
  },1000);
}
async function finishOnlineTurn(){
  clearInterval(comp.timerHandle);
  if(profile){ ensureProfileShape(profile); profile.stats.comps = (profile.stats.comps||0)+1; checkBadges(); }
  try{ await comp.ref.update({ [comp.slot]: { name:comp.name, score:comp.score, index:comp.index, done:true, timeLeft:comp.timeLeft } }); }catch(e){}
  renderOnlineResults();
}
async function renderOnlineResults(){
  maybeShowInterstitial(async ()=>{
    playApplause(); burstConfetti(20);
    let oppData = null;
    try{ const snap = await comp.ref.get(); const data = snap.data(); oppData = comp.slot==='p1' ? data.p2 : data.p1; }catch(e){}
    const oppReady = oppData && oppData.done;
    stage.innerHTML = `
      <div class="screen">
        <div class="end-card">
          <div class="big-emoji">🏆</div>
          <h2>${t('yourResultTitle')}</h2>
          <div class="score-line">${t('correctCount')} <b>${comp.score} / ${comp.questions.length}</b></div>
          ${oppReady
            ? `<div class="vs-row"><div class="vs-player"><div class="nm">${comp.name}</div><div class="sc">${comp.score}</div></div><div class="vs-player"><div class="nm">${oppData.name}</div><div class="sc">${oppData.score}</div></div></div>`
            : `<div class="badge" style="margin-bottom:16px;">${t('waitingOpp')} <b>${comp.code}</b></div>`}
          <div class="love-msg">${t('resultLoveMsg')}</div>
          <div class="btn-stack">
            ${!oppReady?`<button class="ghost-btn" id="refresh">${t('refreshBtn')}</button>`:''}
            <button class="ghost-btn" id="toHub">${t('toMainMenu')}</button>
          </div>
        </div>
      </div>`;
    const rb = document.getElementById('refresh'); if(rb) rb.onclick = renderOnlineResults;
    document.getElementById('toHub').onclick = renderHub;
  });
}

if('speechSynthesis' in window){ window.speechSynthesis.onvoiceschanged = ()=>{}; }

window.addEventListener('popstate', ()=>{
  const ids = ['navBack','gateCancel','rateLater','rateCancel','rateClose','profCancel','toHub'];
  const el = ids.map(id=>document.getElementById(id)).find(Boolean);
  if(el){ try{ history.pushState({hd:1},''); }catch(e){} el.click(); }
});
createFloatingBg();
renderIntro();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
